<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Secret Lake House</title>
  <link rel="stylesheet" href="styles.css?v=88">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <style>
    .admin-page { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: #073d43; }
    .admin-panel { width: min(440px, 100%); padding: 32px; border-radius: var(--radius); background: #fffaf0; box-shadow: 0 24px 70px rgba(0,0,0,.24); }
    .admin-panel .logo { display: block; width: 130px; margin: 0 auto 24px; }
    .admin-panel h1 { margin-bottom: 8px; text-align: center; color: #073d43; text-shadow: none; }
    .admin-panel > p { text-align: center; }
    .admin-form { display: grid; gap: 16px; margin-top: 24px; }
    .admin-form label { display: grid; gap: 7px; font-weight: 700; }
    .admin-form input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    .admin-form .btn { width: 100%; justify-content: center; border: 0; cursor: pointer; }
    .admin-message { min-height: 24px; margin-top: 14px; color: #a33126; text-align: center; }
    .admin-home { display: block; margin-top: 18px; text-align: center; }
    .admin-session { display: none; text-align: center; }
  </style>
</head>
<body>
  <main class="admin-page">
    <section class="admin-panel">
      <a class="logo" href="index.html"><img src="assets/logo.png" alt="Secret Lake House"></a>
      <div data-login-view>
        <h1>Admin Login</h1>
        <p>Sign in to manage Secret Lake House website content.</p>
        <form class="admin-form" data-login-form>
          <label>Username<input name="username" autocomplete="username" required></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="btn" type="submit"><i data-lucide="log-in"></i> Login</button>
        </form>
        <p class="admin-message" data-login-message aria-live="polite"></p>
      </div>
      <div class="admin-session" data-session-view>
        <h1>Welcome</h1>
        <p>You are logged in as <strong data-session-user></strong>.</p>
        <button class="btn" type="button" data-logout>Log Out</button>
      </div>
      <a class="admin-home" href="about.html">Back to About</a>
    </section>
  </main>
  <script>
    const localAdminUrl = 'http://127.0.0.1:8091/admin.html';
    const wrongLocalAddress = location.protocol === 'file:' ||
      (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname) && location.origin !== 'http://127.0.0.1:8091');
    if (wrongLocalAddress) location.replace(localAdminUrl);
    const loginView = document.querySelector('[data-login-view]');
    const sessionView = document.querySelector('[data-session-view]');
    const sessionUser = document.querySelector('[data-session-user]');
    const message = document.querySelector('[data-login-message]');

    async function checkSession() {
      const response = await fetch('/api/admin/session');
      const data = await response.json();
      if (data.authenticated) window.location.replace('admin-dashboard.html');
    }

    document.querySelector('[data-login-form]').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (wrongLocalAddress) { location.replace(localAdminUrl); return; }
      message.textContent = 'Signing in...';
      const form = new FormData(event.currentTarget);
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.get('username'), password: form.get('password') }),
          signal: AbortSignal.timeout(10000)
        });
        const data = await response.json();
        if (!response.ok) {
          message.textContent = data.error || 'Login failed.';
          return;
        }
        window.location.assign('admin-dashboard.html');
      } catch (error) {
        message.textContent = location.hostname === '127.0.0.1'
          ? 'The local login server is unavailable. Double-click Start Admin.cmd in your website folder, then try again.'
          : 'This website cannot reach its admin service. Please use the local admin launcher on your website computer.';
      }
    });

    document.querySelector('[data-logout]').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      location.reload();
    });

    if (!wrongLocalAddress) checkSession().catch(() => { message.textContent = 'Unable to reach the admin service. For local access, double-click Start Admin.cmd in your website folder.'; });
    window.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
  </script>
</body>
</html>
